name: Gather Legal Intelligence Sources

on:
  # Manual trigger only (local launchd handles scheduling)
  workflow_dispatch:
    inputs:
      tier:
        description: 'Tier to fetch (1-5, or "all")'
        required: false
        default: '1'
      skip_pages:
        description: 'Skip page monitoring'
        required: false
        default: 'false'
        type: boolean

jobs:
  fetch-sources:
    runs-on: ubuntu-latest

    concurrency:
      group: gather-sources
      cancel-in-progress: false

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Determine tier
        id: tier
        run: |
          echo "tier=${{ github.event.inputs.tier || '1' }}" >> $GITHUB_OUTPUT

      - name: Fetch RSS feeds
        run: |
          if [ "${{ steps.tier.outputs.tier }}" == "all" ]; then
            python scripts/fetch_rss.py --all
          else
            python scripts/fetch_rss.py --tier=${{ steps.tier.outputs.tier }}
          fi

      - name: Monitor page changes
        if: ${{ github.event.inputs.skip_pages != 'true' }}
        run: |
          if [ "${{ steps.tier.outputs.tier }}" == "all" ]; then
            python scripts/monitor_pages.py --all
          else
            python scripts/monitor_pages.py --tier=${{ steps.tier.outputs.tier }}
          fi

      - name: Check for changes
        id: changes
        run: |
          git add sources/state/
          if git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git commit -m "Auto-fetch: $(date -u +%Y-%m-%d_%H:%M) UTC - Tier ${{ steps.tier.outputs.tier }}"
          git push

      - name: Summary
        run: |
          echo "## Fetch Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Tier: ${{ steps.tier.outputs.tier }}" >> $GITHUB_STEP_SUMMARY
          ITEMS=$(python -c "import sqlite3; print(sqlite3.connect('sources/state/tmt_intelligence.db').execute('SELECT COUNT(*) FROM items').fetchone()[0])" 2>/dev/null || echo "N/A")
          echo "Total items in DB: $ITEMS" >> $GITHUB_STEP_SUMMARY
